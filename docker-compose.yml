services:
  postgres:
    image: postgres:16-alpine
    container_name: tucomida-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tucomida
      POSTGRES_PASSWORD: tucomida_dev
      POSTGRES_DB: tucomida
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
